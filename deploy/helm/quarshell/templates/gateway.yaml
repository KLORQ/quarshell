apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-gateway
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | quote }}
          args: ["--listen", "0.0.0.0:{{ .Values.service.httpPort }}", "--grpc-listen", "0.0.0.0:{{ .Values.service.grpcPort }}"]
          env:
            - name: QUARSHELL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-gateway-token
                  key: token
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            initialDelaySeconds: 3
