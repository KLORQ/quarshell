name: platform-backends

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "quarshell-driver/**"
      - "quarshell-driver-vm/**"
      - "quarshell-driver-mxc/**"
      - "plans/ci-matrix.md"
      - ".github/workflows/platform-backends.yml"

permissions:
  contents: read

jobs:
  linux-kvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build and test VM packages
        run: go test -C quarshell-driver-vm ./... -count=1
      - name: Check hosted KVM access
        id: kvm
        shell: bash
        run: |
          if [ -c /dev/kvm ] && [ "$(id -u)" -ne 0 ]; then
            # GitHub-hosted runners expose /dev/kvm as root:kvm, but the
            # ephemeral runner account is not consistently in the kvm group.
            # Grant this job's primary group access on its disposable runner.
            sudo chgrp "$(id -gn)" /dev/kvm
            sudo chmod 0660 /dev/kvm
          fi
          kvm_device=false
          runtime_available=false
          trust_lock_available=false
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ] && [ "$(id -u)" -ne 0 ]; then
            kvm_device=true
          fi
          if { [ -n "${OPENSHELL_VM_RUNTIME_DIR:-}" ] && [ -s "$OPENSHELL_VM_RUNTIME_DIR/libkrun.so" ] && [ -s "$OPENSHELL_VM_RUNTIME_DIR/libkrunfw.so.5" ]; } || { ldconfig -p 2>/dev/null | grep -q 'libkrun\.so' && ldconfig -p 2>/dev/null | grep -q 'libkrunfw\.so\.5'; }; then
            runtime_available=true
          fi
          if [ -n "${CAUTEM_VM_RUNTIME_TRUST_LOCK:-}" ] && [ -s "$CAUTEM_VM_RUNTIME_TRUST_LOCK" ]; then
            trust_lock_available=true
          fi
          echo "kvm_device=$kvm_device" >> "$GITHUB_OUTPUT"
          echo "runtime_available=$runtime_available" >> "$GITHUB_OUTPUT"
          echo "trust_lock_available=$trust_lock_available" >> "$GITHUB_OUTPUT"
          ls -l /dev/kvm 2>/dev/null || true
          if [ "$kvm_device" = true ] && [ "$runtime_available" = true ] && [ "$trust_lock_available" = true ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$kvm_device" != true ]; then
              echo "::warning::GitHub-hosted ubuntu-24.04 has no usable non-root /dev/kvm; live KVM acceptance remains unverified"
            elif [ "$runtime_available" != true ]; then
              echo "::warning::GitHub-hosted ubuntu-24.04 exposes /dev/kvm, but no compatible libkrun runtime bundle is configured; live KVM acceptance remains unverified"
            else
              echo "::warning::GitHub-hosted ubuntu-24.04 exposes /dev/kvm and libkrun, but no approved runtime digest lock is configured; live KVM acceptance remains unverified"
            fi
          fi
      - name: Run live KVM lifecycle acceptance
        if: steps.kvm.outputs.available == 'true'
        run: task vm:live-linux

  macos-hvf:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Build and test VM packages
        run: go test -C quarshell-driver-vm ./... -count=1
      - name: Check hosted Hypervisor.framework access
        id: hvf
        shell: bash
        run: |
          support="$(sysctl -n kern.hv_support 2>/dev/null || echo 0)"
          echo "kern.hv_support=$support"
          if [ "$support" = 1 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub-hosted macos-14 does not expose Hypervisor.framework; live HVF acceptance remains unverified"
          fi
      - name: Install live VM prerequisites
        if: steps.hvf.outputs.available == 'true'
        run: brew install libkrun libkrunfw e2fsprogs
      - name: Run live HVF lifecycle acceptance
        if: steps.hvf.outputs.available == 'true'
        run: quarshell-driver/scripts/run-live-darwin-arm64-acceptance.sh

  windows-mxc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false
      - name: Check MXC SDK availability
        shell: pwsh
        run: |
          $build = [Environment]::OSVersion.Version.Build
          $wxc = if ($env:OPENSHELL_WXC_EXEC_PATH) { $env:OPENSHELL_WXC_EXEC_PATH } else { 'C:\mxc\wxc-exec.exe' }
          $app = Join-Path (Split-Path $wxc -Parent) 'IsoSessionApp.dll'
          Write-Output "Windows build: $build (MXC requires >= 26300)"
          Write-Output "wxc-exec: $wxc"
          Write-Output "IsoSessionApp.dll: $app"
          if ($build -lt 26300 -or !(Test-Path $wxc) -or !(Test-Path $app)) {
            Write-Output "::warning::GitHub-hosted Windows runner lacks the required Windows 11 Insider build and/or MXC runtime; native MXC acceptance remains unverified"
          }
      - name: Build driver and VM module for Windows
        shell: pwsh
        run: |
          go build -C quarshell-driver ./...
          go build -C quarshell-driver-vm ./...
          go test -C quarshell-driver-vm ./vm -run '^TestVMBackendRegistersFromItsOwnModule$' -count=1
      - name: Run Windows-compatible driver package tests
        shell: pwsh
        run: >-
          go test -C quarshell-driver
          ./driver ./internal/backendcontract ./internal/docker
          ./internal/kubernetes ./internal/mounts ./podman
          ./internal/sidecar ./tests/e2e ./tests/e2e/docker -count=1
