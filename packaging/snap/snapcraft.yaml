name: quarshell
base: core24
version: "0.0.0-dev"
summary: Policy-bound sandboxes for coding agents
description: |
  Quarshell gateway, CLI and policy prover.
grade: devel
confinement: classic

parts:
  quarshell:
    plugin: nil
    source: .
    override-build: |
      VERSION="${SNAPCRAFT_PROJECT_VERSION}" bash tools/release-dry-run.sh
      install -Dm755 release-dry-run/quarshell-cli-linux-amd64 "$SNAPCRAFT_PART_INSTALL/bin/quarshell"
      install -Dm755 release-dry-run/quarshell-gateway-linux-amd64 "$SNAPCRAFT_PART_INSTALL/bin/quarshell-gateway"
      install -Dm755 release-dry-run/quarshell-prover-linux-amd64 "$SNAPCRAFT_PART_INSTALL/bin/quarshell-prover"

apps:
  quarshell:
    command: bin/quarshell
  quarshell-gateway:
    command: bin/quarshell-gateway
  quarshell-prover:
    command: bin/quarshell-prover
