    provider.gh.api:
        name: provider.gh.api
        endpoints:
            - host: api.github.com
              port: 443
              protocol: rest
              tls: terminate
              access: read-only
              enforcement: enforce
              credential_keys:
                - GITHUB_TOKEN
        binaries:
            - path: /usr/bin/gh
            - path: /usr/local/bin/gh
            - path: /usr/bin/git
            - path: /usr/local/bin/git
    provider.gh.git:
        name: provider.gh.git
        endpoints:
            - host: github.com
              port: 443
              protocol: rest
              tls: terminate
              rules:
                - allow:
                    method: GET
                    path: '**'
                - allow:
                    method: HEAD
                    path: '**'
                - allow:
                    method: OPTIONS
                    path: '**'
                - allow:
                    method: POST
                    path: /**/git-upload-pack
              enforcement: enforce
              credential_keys:
