            - path: /opt/cursor-agent/**
            - path: /opt/cursor-agent/versions/*/node
            - path: /opt/cursor-agent/versions/*/cursor-agent
            - path: /usr/bin/curl
            - path: /usr/local/bin/curl
    provider.cursor.cursor-com-apex:
        name: provider.cursor.cursor-com-apex
