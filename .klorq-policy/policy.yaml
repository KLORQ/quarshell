    storage-googleapis:
        name: storage-googleapis
        endpoints:
            - host: storage.googleapis.com
              port: 443
inference:
    providers:
        - anthropic
        - openai
display:
    mode: none
    publish: 127.0.0.1
    port: 6080
    auth: password
    browser: chromium
credentials:
    env_allow:
        - TERM
        - LANG
        - COLORTERM
        - GITHUB_TOKEN
        - GH_TOKEN
