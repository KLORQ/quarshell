            - path: /opt/cursor-agent/**
            - path: /opt/cursor-agent/versions/*/node
            - path: /opt/cursor-agent/versions/*/cursor-agent
            - path: /usr/bin/curl
            - path: /usr/local/bin/curl
    provider.cursor.downloads:
        name: provider.cursor.downloads
        endpoints:
            - host: downloads.cursor.com
              port: 443
              credential_keys:
                - CURSOR_API_KEY
        binaries:
            - path: /usr/bin/agent
            - path: /usr/local/bin/agent
            - path: /usr/local/bin/cursor-agent
            - path: /opt/cursor-agent/**
            - path: /opt/cursor-agent/versions/*/node
            - path: /opt/cursor-agent/versions/*/cursor-agent
            - path: /usr/bin/curl
